[project]
name = "kaiju-desk"
version = "0.1.0"
description = "A work contract between human and AI that lives in the folder."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ['tomli>=2.0; python_version < "3.11"']

[project.scripts]
kaiju = "kaiju.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaiju"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# guide.py is a document: its lines are the text the agent reads.
"kaiju/guide.py" = ["E501"]
